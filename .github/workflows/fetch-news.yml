name: Fetch news

on:
  schedule:
    # GitHub often starts scheduled jobs 1-2+ hours late, so run well before the
    # 06:30 IST bulletin, with later passes as backups.
    - cron: "17 21 * * *"   # 02:47 IST
    - cron: "7 23 * * *"    # 04:37 IST
    - cron: "17 0 * * *"    # 05:47 IST backup
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_news.py
      - .github/workflows/fetch-news.yml

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch news
        run: python scripts/fetch_news.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stories.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "News: $(date -u +%Y-%m-%d) $(date -u +%H:%M) UTC"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
