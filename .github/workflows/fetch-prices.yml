name: Fetch prices

on:
  schedule:
    # GitHub often starts scheduled jobs 1-2+ hours late (Sep 28: 23:45 UTC fired at 01:57 UTC),
    # so fetch well before the 06:30 IST bulletin run, with a second pass as a backup.
    - cron: "17 20 * * *"   # 01:47 IST
    - cron: "7 0 * * *"     # 05:37 IST backup
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_prices.py
      - .github/workflows/fetch-prices.yml

permissions:
  contents: write

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices
        run: python scripts/fetch_prices.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/prices_history/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Prices: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
