name: Notify test (one-off)

# Temporary: proves a site-check issue reaches the owner. Removed in the next commit.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/notify-test.yml

permissions:
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create site-check --color B60205 --description "Verify site check failed" --force
          printf 'TEST of the new failure alert: if you got this email, alerts work. The next passing Verify site check closes this issue automatically.\n\nRun log: %s\n' "$RUN_URL" > body.md
          gh issue create --title "Site check alert test — $(TZ=Asia/Kolkata date +%Y-%m-%d)" --label site-check --body-file body.md
